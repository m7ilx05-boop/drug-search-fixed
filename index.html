<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#BFE6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#143B5E" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Pharmacist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>The Pharmacist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
<header class="appbar"><div class="appbar-in">
<button id="back" class="back" type="button" aria-label="رجوع">→</button>
<img class="logo robot" src="robot-coat.webp" width="300" height="300" alt="" decoding="async">
<div><h1 id="ab-t">The Pharmacist</h1><p class="sub" id="ab-s">ابحث بالاسم التجاري أو المادة الفعّالة</p></div>
</div>
<svg class="deco" viewBox="0 0 150 130" aria-hidden="true">
  <path d="M18 112c-8-22-2-42 16-50 2 20-2 38-16 50z" fill="#3FAE6A"/>
  <path d="M30 118c-4-18 4-34 20-40 0 16-6 32-20 40z" fill="#2E9A5A"/>
  <rect x="44" y="40" width="58" height="76" rx="14" fill="#fff"/>
  <rect x="44" y="40" width="58" height="76" rx="14" fill="none" stroke="#CFE6F7" stroke-width="2"/>
  <rect x="48" y="22" width="50" height="22" rx="7" fill="#1E7BE0"/>
  <rect x="48" y="32" width="50" height="4" fill="#0D5CBF" opacity=".5"/>
  <rect x="58" y="58" width="30" height="34" rx="8" fill="#E4F1FC"/>
  <path d="M73 63v24M61 75h24" stroke="#1E7BE0" stroke-width="7" stroke-linecap="round"/>
  <g transform="rotate(14 118 98)">
    <rect x="98" y="66" width="40" height="52" rx="8" fill="#CFE9FA"/>
    <circle cx="108" cy="78" r="5" fill="#fff"/><circle cx="126" cy="78" r="5" fill="#fff"/>
    <circle cx="108" cy="94" r="5" fill="#fff"/><circle cx="126" cy="94" r="5" fill="#fff"/>
    <circle cx="108" cy="110" r="5" fill="#fff"/><circle cx="126" cy="110" r="5" fill="#fff"/>
  </g>
</svg>
</header>
<main>

<!-- الصفحة 1: الرئيسية -->
<section id="v-home" class="view">
<form id="f">
  <div class="row">
    <input id="q" type="search" required minlength="2" maxlength="100" placeholder="مثال: Panadol أو باراسيتامول" aria-label="اسم الدواء أو المادة الفعّالة" autocomplete="off">
    <button id="ffBtn" class="ff-btn" type="button" aria-label="إعدادات البحث: نوع البحث والشكل الدوائي" aria-expanded="false" aria-controls="forms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <div id="recent" class="recent" role="group" aria-label="آخر عمليات البحث"></div>
  </div>
  <div id="forms" class="forms" role="group" aria-label="إعدادات البحث" hidden>
    <div class="set-h">نوع البحث</div>
      <div class="types" role="radiogroup" aria-label="نوع البحث">
      <label><input type="radio" name="t" value="auto" checked><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/></svg><span>تلقائي</span></label>
      <label><input type="radio" name="t" value="brand_family"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.9 3.6 5.2 5.4 5.2 10.2a5.2 5.2 0 0 1-10.4 0c0-2 .9-3.3 2-4.2.2 1.6 1 2.3 1.9 2.6C10.2 8.2 10.4 4.6 12 2z" fill="currentColor"/></svg><span>عائلة تجارية</span></label>
      <label><input type="radio" name="t" value="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5V4h8.5L21 13.5 13.5 21z" fill="currentColor"/><circle cx="7.6" cy="8.6" r="1.5" fill="var(--tag-hole,#fff)"/></svg><span>منتج محدد</span></label>
      <label><input type="radio" name="t" value="ingredient"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="5.5" cy="5.5" r="2"/><circle cx="12" cy="5.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><circle cx="5.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="12" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></g></svg><span>مادة فعّالة</span></label>
    </div>
  </div>
  <button id="go" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h17l-6.5 7.6V19l-4-2v-4.4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>بحث</span></button>
</form>

<div class="drugs3d" id="drugs3d" aria-label="أدوية شائعة"><div class="d3-inner" id="d3inner"></div></div>
</section>

<div id="imgbox" aria-live="polite"></div>

<!-- الصفحة 2: نتائج البحث -->
<section id="v-results" class="view">
<div id="status" role="status" aria-live="polite"><span id="msg"></span><div class="bar"><div class="typewriter" aria-hidden="true"><div class="slide"><i></i></div><div class="paper"></div><div class="keyboard"></div></div><i id="pg"></i></div></div>
<div id="ffnote" class="sec-note ff-note" hidden></div>
<div id="out"></div>
<div id="more" aria-live="polite"></div>
</section>

<!-- صفحة البحث بصورة (#/img): image-search.js بيملاها -->
<section id="v-image" class="view"><div id="imgpage" class="imgpage"></div></section>

<!-- الصفحة 3: تفاصيل المنتج (pages.js بيملاها) -->
<section id="v-product" class="view"><div id="pd" class="detail"></div></section>
</main>

<!-- الترتيب مهم: كل ملف بيعتمد على اللي قبله. barcode-live لازم يكون آخر واحد (source-scrub بعده بيراقب بس). -->
<script src="core.js"></script>
<script src="render.js"></script>
<script src="alternatives.js"></script>
<script src="search.js"></script>
<script src="home-cards.js"></script>
<script src="scanner.js"></script>
<script src="rx-scan.js"></script>
<script src="image-search.js?v=20261122b"></script>
<script src="interactions.js?v=20261122g"></script>
<script src="pages.js"></script>
<script src="dosage-filter.js"></script>
<script src="ingredient-class.js"></script>
<script src="barcode-live.js"></script>
<script src="source-scrub.js"></script>
<script src="shine.js"></script>
<script>
// بيلمّ أزرار (المسح الضوئي / الكاميرا / المعرض) اللي الملفات التانية بتضيفها في الفورم جوه صندوق "اقتراحات سريعة". شكل بس، مفيش منطق اتغيّر.
(function () {
  var f = document.getElementById("f"), bs = f && f.querySelectorAll(".scan-btn");
  if (!bs || !bs.length) return;
  var box = document.createElement("div"); box.className = "qs";
  var h = document.createElement("div"); h.className = "qs-h"; h.textContent = "المسح الضوئي والبحث بصورة";
  box.appendChild(h);
  Array.prototype.forEach.call(bs, function (b) { var t = (b.textContent || "").trim(); b.setAttribute("aria-label", t); b.title = t; box.appendChild(b); }); // أيقونات بس: الاسم للقارئ والـ tooltip
  var m = f.querySelector(".img-menu"); if (m) box.appendChild(m);
  f.parentNode.insertBefore(box, f.nextSibling); // صندوق منفصل تحت مربع البحث
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
