<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بحث الأدوية في السوق المصري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>بحث الأدوية في السوق المصري</h1>
<p class="sub">ابحث باسم تجاري أو مادة فعّالة، بالعربي أو الإنجليزي.</p>

<form id="f">
  <div class="row">
    <input id="q" type="search" required minlength="2" maxlength="100" placeholder="مثال: Panadol أو باراسيتامول" aria-label="اسم الدواء أو المادة الفعّالة" autocomplete="off">
    <button id="go" type="submit">بحث</button>
  </div>
  <div class="types" role="radiogroup" aria-label="نوع البحث">
    <label><input type="radio" name="t" value="auto" checked>تلقائي</label>
    <label><input type="radio" name="t" value="brand_family">عائلة تجارية</label>
    <label><input type="radio" name="t" value="brand">منتج محدد</label>
    <label><input type="radio" name="t" value="ingredient">مادة فعّالة</label>
  </div>
  <div id="recent" class="recent" role="group" aria-label="آخر عمليات البحث"></div>
</form>

<div id="imgbox" aria-live="polite"></div>
<div id="status" role="status" aria-live="polite"><span id="msg"></span><div class="bar"><i id="pg"></i></div></div>
<div id="out"></div>
<div id="more" aria-live="polite"></div>
</main>

<!-- الترتيب مهم: كل ملف بيعتمد على اللي قبله. barcode-live لازم يكون آخر واحد. -->
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/alternatives.js"></script>
<script src="js/search.js"></script>
<script src="js/scanner.js"></script>
<script src="js/image-search.js"></script>
<script src="js/barcode-live.js"></script>
</body>
</html>
