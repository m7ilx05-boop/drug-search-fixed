<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليل الدواء">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>بحث الأدوية في السوق المصري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar"><div class="appbar-in">
<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-40 16 16)"><rect x="2" y="10" width="28" height="12" rx="6" fill="#fff"/><path d="M16 10h8a6 6 0 0 1 0 12h-8z" fill="#8FE0BE"/></g></svg>
<div><h1>دليل الدواء</h1><p class="sub">السوق المصري — ابحث بالاسم التجاري أو المادة الفعّالة</p></div>
</div></header>
<main>

<form id="f">
  <div class="row">
    <input id="q" type="search" required minlength="2" maxlength="100" placeholder="مثال: Panadol أو باراسيتامول" aria-label="اسم الدواء أو المادة الفعّالة" autocomplete="off">
    <button id="go" type="submit">بحث</button>
  </div>
  <div class="types" role="radiogroup" aria-label="نوع البحث">
    <label><input type="radio" name="t" value="auto" checked>تلقائي</label>
    <label><input type="radio" name="t" value="brand_family">عائلة تجارية</label>
    <label><input type="radio" name="t" value="brand">منتج محدد</label>
    <label><input type="radio" name="t" value="ingredient">مادة فعّالة</label>
  </div>
  <div id="recent" class="recent" role="group" aria-label="آخر عمليات البحث"></div>
</form>

<div id="imgbox" aria-live="polite"></div>
<div id="status" role="status" aria-live="polite"><span id="msg"></span><div class="bar"><i id="pg"></i></div></div>
<div id="out"></div>
<div id="more" aria-live="polite"></div>
</main>

<!-- الترتيب مهم: كل ملف بيعتمد على اللي قبله. barcode-live لازم يكون آخر واحد. -->
<script src="core.js"></script>
<script src="render.js"></script>
<script src="alternatives.js"></script>
<script src="search.js"></script>
<script src="scanner.js"></script>
<script src="image-search.js"></script>
<script src="barcode-live.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
