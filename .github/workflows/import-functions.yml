name: Import Supabase functions

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_REF: clhtimetvykbjdhfdmig

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          slugs=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" | jq -r '.[].slug')
          echo "Functions: $slugs"
          for s in $slugs; do
            echo "Downloading $s"
            supabase functions download "$s" --project-ref "$PROJECT_REF" --use-api
          done
          ls -R supabase/functions | head -100

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add supabase
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Import edge functions from Supabase"
          git push
