name: Run a Supabase function

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function name"
        required: true
      body:
        description: "JSON body"
        required: true
        default: '{"action":"peek"}'

env:
  PROJECT_REF: clhtimetvykbjdhfdmig

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FN: ${{ github.event.inputs.function }}
          BODY: ${{ github.event.inputs.body }}
        run: |
          set -e
          KEY=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" | jq -r '[.[]|select(.name=="anon")][0].api_key')
          echo "::add-mask::$KEY"
          curl -s -m 150 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/$FN" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "$BODY" | head -c 6000 > resp.txt
          cat resp.txt; echo
          echo "::notice title=result::$(head -c 1800 resp.txt | tr '\n' ' ')"
