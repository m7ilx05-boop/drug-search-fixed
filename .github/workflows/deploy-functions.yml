name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      only:
        description: "Function name to deploy (empty = all)"
        required: false

env:
  PROJECT_REF: clhtimetvykbjdhfdmig

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.only }}" ]; then
              list="${{ github.event.inputs.only }}"
            else
              list=$(ls supabase/functions)
            fi
          else
            list=$(git diff --name-only HEAD~1 HEAD -- supabase/functions \
              | cut -d/ -f3 | sort -u)
          fi
          for s in $list; do
            [ -d "supabase/functions/$s" ] || { echo "skip $s"; continue; }
            echo "Deploying $s"
            if ! supabase functions deploy "$s" --project-ref "$PROJECT_REF" --use-api --yes > out.txt 2>&1; then
              cat out.txt
              echo "::error title=deploy $s failed::$(tail -c 700 out.txt | tr '\n' ' ' | tr -d '\r')"
              failed=1
            else
              tail -n 3 out.txt
            fi
          done
          [ -z "$failed" ] || exit 1
