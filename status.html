<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حالة مفاتيح Tavily و Firecrawl</title>
<style>
:root{--bg:#f4f7f7;--card:#fff;--tx:#1b2b2b;--mu:#6b7c7c;--ln:#e3eaea;--ok:#1f9d63;--bad:#d64545;--warn:#d9902f;--br:#0f6b62}
@media(prefers-color-scheme:dark){:root{--bg:#10191a;--card:#182424;--tx:#e6f0ef;--mu:#8fa5a3;--ln:#263838;--ok:#3fcf8e;--bad:#ff6b6b;--warn:#f0b04e;--br:#3bb5a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:14px;max-width:760px;margin-inline:auto}
h1{font-size:19px;margin:6px 0 2px}
.sub{color:var(--mu);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--br);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
button:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 8px}
.stats{display:flex;gap:8px;margin-bottom:8px}
.stat{flex:1;background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mu)}
.row{display:grid;grid-template-columns:92px 1fr minmax(64px,auto);gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--ln);font-size:13px}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.num{white-space:nowrap;text-align:start;font-variant-numeric:tabular-nums;direction:ltr}
.row.l{grid-template-columns:78px 1fr 40px}
.err{color:var(--bad);font-size:13px}
.tabs{display:flex;gap:6px;margin:4px 0 8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs a{flex:1;text-align:center;padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--ln);color:var(--mu);text-decoration:none;font-size:14px}
.tabs a.on{background:var(--br);color:#fff;border-color:var(--br)}
.op{border-top:1px solid var(--ln);padding:9px 0;font-size:13px}
.op:first-of-type{border-top:0}
.op b{font-weight:600;word-break:break-word}
.op .meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;margin-inline-end:6px;background:var(--bg);color:var(--mu);border:1px solid var(--ln)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.mu{color:var(--mu);font-size:12px}
.usage{margin-top:8px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.usage .uh{font-size:12px;font-weight:600;margin-bottom:4px}
.krow{display:grid;grid-template-columns:78px 62px 1fr;gap:6px 8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--ln);font-size:12.5px}
.krow:first-of-type{border-top:0}
.kp{font-weight:700;font-size:12px}
.kp-tavily{color:#2f7ddb}.kp-firecrawl{color:#e0722b}.kp-gemini{color:#8a5cf5}.kp-grok{color:var(--mu)}
.kslot{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:start;word-break:break-all}
.kv{color:var(--tx)}
.utot{margin-top:6px;padding-top:6px;border-top:1px dashed var(--ln);font-size:12px;color:var(--mu)}
.utot b{color:var(--tx);font-weight:600}
</style>
</head>
<body>
<div class="tabs"><a href="#keys" id="t-keys">المفاتيح</a><a href="#ops" id="t-ops">العمليات</a></div>
<div id="pg-keys">
<h1>حالة مفاتيح البحث</h1>
<div class="sub"><span id="when">جاري التحميل…</span><button id="btn">افحص الآن</button></div>
<div id="err" class="err"></div>
<div class="card" id="tav"></div>
<div class="card" id="fc"></div>
<div class="card" id="gem"></div>
<div class="card" id="grk"></div>
</div>
<div id="pg-ops" hidden>
<h1>العمليات والاستهلاك</h1>
<div class="sub"><span id="owhen">جاري التحميل…</span><button id="obtn">تحديث</button></div>
<div id="oerr" class="err"></div>
<div class="card" id="osum"></div>
<div class="card" id="ofeed"></div>
</div>
<script>
const SNAP={"checked_at":null,"tavily":[],"firecrawl":[],"llm":[]};
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("en");
const col=p=>p<=0?"var(--bad)":p<.25?"var(--warn)":"var(--ok)";
function render(el,title,list,unit){
  const live=list.filter(k=>k.state==="active");
  const total=live.reduce((s,k)=>s+Math.max(k.left,0),0);
  let h=`<h2>${title}</h2><div class="stats">
  <div class="stat"><b>${fmt(total)}</b><span>إجمالي المتبقي</span></div>
  <div class="stat"><b>${live.length} / ${list.length}</b><span>مفاتيح شغالة</span></div></div>`;
  for(const k of list){
    const left=Math.max(k.left,0),p=k.cap?left/k.cap:0;
    h+=`<div class="row"><span>${k.slot}</span><div class="bar"><i style="width:${Math.min(p,1)*100}%;background:${col(k.state==="active"?p:0)}"></i></div><span class="num">${k.state==="active"?fmt(left):k.state==="exhausted"?(k.renews?"يتجدد "+fd(k.renews):"خلص"):"تعذر الفحص"}</span></div>`;
  }
  el.innerHTML=h;
}
const fd=t=>t?new Date(t.replace(" ","T")).toLocaleDateString("ar-EG",{day:"numeric",month:"short"}):"—";
function llmState(r){
  const bl=r.blocked_until&&Date.parse(String(r.blocked_until).replace(" ","T"))>Date.now();
  if(Number(r.last_status)===401)return["bad","مفتاح مرفوض (401)"];
  if(r.block_reason==="credits_exhausted")return bl?["bad","الرصيد خلص"]:["warn","الرصيد خلص (آخر مرة "+fd(r.last_used_at)+")"];
  if(bl)return["warn","محظور مؤقتاً"];
  return["ok","شغال"];
}
function renderLLM(el,title,list,note){
  const today=new Date().toISOString().slice(0,10);
  const used=r=>r.usage_day===today?Number(r.used_today):0;
  const ok=list.filter(r=>llmState(r)[0]==="ok").length;
  let h=`<h2>${title}</h2><div class="stats"><div class="stat"><b>${ok} / ${list.length}</b><span>مفاتيح سليمة</span></div><div class="stat"><b>${fmt(list.reduce((s,r)=>s+used(r),0))}</b><span>طلبات النهاردة</span></div></div>`;
  for(const r of list){const[c,t]=llmState(r);h+=`<div class="row l"><span>${r.slot}</span><span style="color:var(--${c==="ok"?"ok":c==="warn"?"warn":"bad"})">${t}</span><span class="num">${used(r)}</span></div>`}
  el.innerHTML=h+`<div class="sub" style="margin-top:8px">${note}</div>`;
}
function draw(d,live){
  render($("tav"),"Tavily",d.tavily.map(k=>({slot:k.slot,state:k.state,cap:k.limit||1000,left:(k.limit||1000)-k.used,renews:k.renews})));
  render($("fc"),"Firecrawl",d.firecrawl.map(k=>({slot:k.slot,state:k.state,cap:k.plan||1000,left:k.remaining,renews:k.renews})));
  const g=(d.llm||[]).filter(r=>r.provider==="gemini"),x=(d.llm||[]).filter(r=>r.provider==="grok");
  renderLLM($("gem"),"Gemini",g,"جوجل مبتعرضش الرصيد المتبقي. العمود الأخير = طلبات النهاردة. إجمالي الطلبات: "+fmt(g.reduce((s,r)=>s+Number(r.total_used),0)));
  renderLLM($("grk"),"Grok",x,"الحالة من آخر محاولة استخدام. رصيد xAI مش متاح من المفتاح. X_6 وX_8 مش مسجلين.");
  const t=d.checked_at?new Date(d.checked_at):null;
  $("when").textContent=(live?"آخر فحص: ":"لقطة قديمة من: ")+(t?t.toLocaleString("ar-EG"):"—");
}
const API="https://clhtimetvykbjdhfdmig.supabase.co/functions/v1/key-status";
let busy=false;
async function load(force){
  if(busy)return;busy=true;const b=$("btn");b.disabled=true;
  if(force)b.textContent="جاري الفحص…";
  $("err").textContent="";
  try{
    const r=await fetch(API+(force?"?refresh=1":""),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    draw(await r.json(),true);
  }catch(e){$("err").textContent="تعذر التحميل ("+e.message+")، المعروض آخر ما وصل."}
  busy=false;b.disabled=false;b.textContent="افحص الآن";
}
$("btn").onclick=()=>load(true);
load(false);setInterval(()=>load(false),60000);

/* ===== صفحة العمليات ===== */
const OPS_API="https://clhtimetvykbjdhfdmig.supabase.co/functions/v1/ops-feed";
const KIND={full:"بحث كامل",alternatives:"بدائل",secondary:"بحث ثانوي"};
const OUTC={found:["ok","لقى نتيجة"],not_found:["bad","مفيش نتيجة"],under_review:["warn","قيد المراجعة"]};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(t){const s=Math.max(0,(Date.now()-Date.parse(t))/1000);if(s<60)return "من "+Math.round(s)+" ث";if(s<3600)return "من "+Math.round(s/60)+" د";if(s<86400)return "من "+Math.round(s/3600)+" س";return new Date(t).toLocaleDateString("ar-EG",{day:"numeric",month:"short"})}
function clock(t){return new Date(t).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function stat(b,l){return '<div class="stat"><b>'+b+'</b><span>'+l+'</span></div>'}
function urow(l,v,p){return '<div class="row"><span>'+l+'</span><div class="bar"><i style="width:'+(Math.min(Math.max(p,0),1)*100)+'%;background:'+col(1-p)+'"></i></div><span class="num">'+v+'</span></div>'}
function trow(l,v){return '<div class="row"><span>'+l+'</span><span>'+v+'</span><span></span></div>'}
function drawOps(d){
  const s=d.summary,oc=s.outcomes_24h||{};
  let h='<h2>آخر 24 ساعة</h2><div class="stats">'+stat(fmt(s.searches_24h),"عمليات بحث")+stat(fmt(s.jobs_24h),"مهام تشغيل")+stat(fmt(s.jobs_failed_24h),"مهام فاشلة")+'</div>';
  h+='<div class="sub">لقى: '+fmt(oc.found||0)+' · مفيش نتيجة: '+fmt(oc.not_found||0)+' · قيد المراجعة: '+fmt(oc.under_review||0)+'</div>';
  h+='<h2 style="margin-top:14px">الاستهلاك من كل المفاتيح</h2>';
  h+=urow("Tavily",fmt(s.tavily_used)+" / "+fmt(s.tavily_limit),s.tavily_limit?s.tavily_used/s.tavily_limit:0);
  h+=urow("Firecrawl",fmt(s.firecrawl_used)+" / "+fmt(s.firecrawl_limit),s.firecrawl_limit?s.firecrawl_used/s.firecrawl_limit:0);
  h+=trow("Firecrawl 24س","~"+fmt(s.firecrawl_pages_24h)+" صفحة");
  h+=trow("Gemini",fmt(s.gemini_calls_today)+" طلب النهاردة · "+fmt(s.gemini_calls_total)+" إجمالي");
  h+=trow("Grok",fmt(s.grok_calls_today)+" طلب · $"+Number(s.grok_spent_today_usd).toFixed(4)+" النهاردة");
  h+='<div class="sub" style="margin-top:8px">Tavily وFirecrawl: الاستهلاك الكلي من فحص المفاتيح (الباقة الحالية لكل المفاتيح). استهلاك كل مفتاح في كل عملية لوحدها ظاهر تحت كل عملية (من أول ما اتفعّل التسجيل). علامة ~ = رقم تقديري لأن المزوّد مبيرجعوش.</div>';
  $("osum").innerHTML=h;
  drawFeed(d.items||[]);
  $("owhen").textContent="آخر تحديث: "+clock(d.generated_at);
}
const PNAME={tavily:"Tavily",firecrawl:"Firecrawl",gemini:"Gemini",grok:"Grok"};
function usageHtml(u){
  if(!u||!u.keys||!u.keys.length)return "";
  let h='<div class="usage"><div class="uh">المفاتيح اللي اشتغلت في العملية دي وكل مفتاح استهلك كام</div>';
  for(const k of u.keys){
    const p=[fmt(k.calls)+" طلب"+(k.failed?' (<span class="bad">'+fmt(k.failed)+" فشل</span>)":"")];
    if(k.provider==="tavily"||k.provider==="firecrawl")p.push((k.credits_estimated?"~":"")+fmt(k.credits)+" كريدت");
    else{
      p.push(k.tokens_total?fmt(k.tokens_in)+" دخل + "+fmt(k.tokens_out)+" خرج = <b>"+fmt(k.tokens_total)+"</b> توكن":"التوكنز مش متاحة");
      if(k.provider==="grok"&&k.usd_estimated!=null)p.push("~$"+Number(k.usd_estimated).toFixed(4));
    }
    if(k.models&&k.models.length)p.push('<span class="mu" dir="ltr">'+esc(k.models.join(", "))+"</span>");
    h+='<div class="krow"><span class="kp kp-'+esc(k.provider)+'">'+esc(PNAME[k.provider]||k.provider)+'</span><b class="kslot">'+esc(k.slot)+'</b><span class="kv">'+p.join(" · ")+"</span></div>";
  }
  const t=u.totals||{},tt=[];
  if(t.tavily_credits)tt.push("Tavily <b>"+fmt(t.tavily_credits)+"</b> كريدت");
  if(t.firecrawl_credits)tt.push("Firecrawl <b>"+fmt(t.firecrawl_credits)+"</b> كريدت");
  if(t.gemini_tokens)tt.push("Gemini <b>"+fmt(t.gemini_tokens)+"</b> توكن");
  if(t.grok_tokens)tt.push("Grok <b>"+fmt(t.grok_tokens)+"</b> توكن (~$"+Number(t.grok_usd_estimated).toFixed(4)+")");
  if(tt.length)h+='<div class="utot">إجمالي العملية: '+tt.join(" · ")+"</div>";
  return h+"</div>";
}
function drawFeed(items){
  let h='<h2>كل العمليات (الأحدث أولاً)</h2>';
  if(!items.length)h+='<div class="mu">مفيش عمليات.</div>';
  for(const o of items){
    let tag,st,meta=[],title=esc(o.query),usage="",note="";
    if(o.type==="job"){
      tag=KIND[o.kind]||o.kind||"مهمة";
      st=o.status==="failed"?["bad","فشلت"]:(o.status==="completed"?(OUTC[o.outcome]||["ok","تمت"]):["warn",esc(o.status||"—")]);
      if(o.secs!=null)meta.push("⏱ "+o.secs+" ث");
      if(o.pages)meta.push("صفحات: "+o.pages);
      if(o.results!=null)meta.push("نتائج: "+o.results);
      if(o.usage&&o.usage.keys&&o.usage.keys.length)usage=usageHtml(o.usage);
      else{
        if(o.tavily&&o.tavily.length)meta.push("Tavily: "+esc(o.tavily.join("، ")));
        if(o.firecrawl&&o.firecrawl.length)meta.push("Firecrawl: "+esc(o.firecrawl.join("، ")));
        if((o.tavily&&o.tavily.length)||(o.firecrawl&&o.firecrawl.length))note='<div class="mu" style="margin-top:4px">اتنفذت قبل تفعيل تسجيل الاستهلاك: أسماء المفاتيح بس من غير أرقام.</div>';
      }
    }else if(o.type==="background"){
      tag="خلفية";title=esc(o.label);st=["ok","عمل جانبي"];
      usage=usageHtml(o.usage);
    }else{
      tag="بحث"+(o.cache?" · "+esc(o.cache):"");
      st=OUTC[o.outcome]||["warn",esc(o.outcome||"—")];
      if(o.results!=null)meta.push("نتائج: "+o.results);
    }
    h+='<div class="op"><div><span class="tag">'+esc(tag)+'</span><b dir="auto">'+title+'</b></div>'
      +'<div class="meta"><span class="'+st[0]+'">'+st[1]+'</span><span>'+clock(o.t)+' ('+ago(o.t)+')</span>'+meta.map(x=>'<span>'+x+'</span>').join("")+'</div>'
      +usage+note+(o.error?'<div class="err">'+esc(o.error)+'</div>':'')+'</div>';
  }
  $("ofeed").innerHTML=h;
}
let obusy=false;
async function loadOps(){
  if(obusy)return;obusy=true;const b=$("obtn");b.disabled=true;$("oerr").textContent="";
  try{
    const r=await fetch(OPS_API,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();drawOps(d);
    if(d.warnings&&d.warnings.length)$("oerr").textContent="تنبيه: "+d.warnings.join(" | ");
  }catch(e){$("oerr").textContent="تعذر التحميل ("+e.message+")"}
  obusy=false;b.disabled=false;
}
function tab(){
  const ops=location.hash==="#ops";
  $("pg-keys").hidden=ops;$("pg-ops").hidden=!ops;
  $("t-keys").className=ops?"":"on";$("t-ops").className=ops?"on":"";
  if(ops)loadOps();
}
$("obtn").onclick=loadOps;
window.addEventListener("hashchange",tab);
setInterval(()=>{if(location.hash==="#ops"&&!document.hidden)loadOps()},15000);
tab();
</script>
</body>
</html>
