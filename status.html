<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حالة مفاتيح Tavily و Firecrawl</title>
<style>
:root{--bg:#f4f7f7;--card:#fff;--tx:#1b2b2b;--mu:#6b7c7c;--ln:#e3eaea;--ok:#1f9d63;--bad:#d64545;--warn:#d9902f;--br:#0f6b62}
@media(prefers-color-scheme:dark){:root{--bg:#10191a;--card:#182424;--tx:#e6f0ef;--mu:#8fa5a3;--ln:#263838;--ok:#3fcf8e;--bad:#ff6b6b;--warn:#f0b04e;--br:#3bb5a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:14px;max-width:760px;margin-inline:auto}
h1{font-size:19px;margin:6px 0 2px}
.sub{color:var(--mu);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--br);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
button:disabled{opacity:.6}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 8px}
.stats{display:flex;gap:8px;margin-bottom:8px}
.stat{flex:1;background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mu)}
.row{display:grid;grid-template-columns:92px 1fr minmax(64px,auto);gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--ln);font-size:13px}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.num{white-space:nowrap;text-align:start;font-variant-numeric:tabular-nums;direction:ltr}
.row.l{grid-template-columns:78px 1fr 40px}
.err{color:var(--bad);font-size:13px}
.tabs{display:flex;gap:6px;margin:4px 0 8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs a{flex:1;text-align:center;padding:9px 4px;border-radius:10px;background:var(--card);border:1px solid var(--ln);color:var(--mu);text-decoration:none;font-size:13px}
.tabs a.on{background:var(--br);color:#fff;border-color:var(--br)}
.op{border-top:1px solid var(--ln);padding:9px 0;font-size:13px}
.op:first-of-type{border-top:0}
.op b{font-weight:600;word-break:break-word}
.op .meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;margin-inline-end:6px;background:var(--bg);color:var(--mu);border:1px solid var(--ln)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.mu{color:var(--mu);font-size:12px}
.use{font-size:12px;margin-top:4px;color:var(--mu)}
.cr{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--ln);background:var(--bg);color:var(--mu);font-size:12px;cursor:pointer}
.chip.on{background:var(--br);color:#fff;border-color:var(--br)}
.sev{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.sev.error{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--mu)}
.krow{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;font-size:12px;padding:3px 0;border-top:1px solid var(--ln)}
.expl{font-size:12px;color:var(--mu);margin-top:3px}
</style>
</head>
<body>
<div class="tabs"><a href="#keys" id="t-keys">المفاتيح</a><a href="#ops" id="t-ops">العمليات</a><a href="#errors" id="t-err">الأخطاء</a></div>
<div id="pg-keys">
<h1>حالة مفاتيح البحث</h1>
<div class="sub"><span id="when">جاري التحميل…</span><button id="btn">افحص الآن</button></div>
<div id="err" class="err"></div>
<div class="card" id="tav"></div>
<div class="card" id="fc"></div>
<div class="card" id="gem"></div>
<div class="card" id="grk"></div>
</div>
<div id="pg-ops" hidden>
<h1>العمليات والاستهلاك</h1>
<div class="sub"><span id="owhen">جاري التحميل…</span><button id="obtn">تحديث</button></div>
<div id="oerr" class="err"></div>
<div class="card" id="osum"></div>
<div class="card" id="ofeed"></div>
</div>
<div id="pg-err" hidden>
<h1>الأخطاء والمشاكل</h1>
<div class="sub"><span id="ewhen">جاري التحميل…</span><button id="ebtn">تحديث</button></div>
<div id="eerr" class="err"></div>
<div class="card" id="esum"></div>
<div class="card" id="elist"></div>
</div>
<script>
const SNAP={"checked_at":null,"tavily":[],"firecrawl":[],"llm":[]};
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("en");
const col=p=>p<=0?"var(--bad)":p<.25?"var(--warn)":"var(--ok)";
function render(el,title,list,unit){
  const live=list.filter(k=>k.state==="active");
  const total=live.reduce((s,k)=>s+Math.max(k.left,0),0);
  let h=`<h2>${title}</h2><div class="stats">
  <div class="stat"><b>${fmt(total)}</b><span>إجمالي المتبقي</span></div>
  <div class="stat"><b>${live.length} / ${list.length}</b><span>مفاتيح شغالة</span></div></div>`;
  for(const k of list){
    const left=Math.max(k.left,0),p=k.cap?left/k.cap:0;
    h+=`<div class="row"><span>${k.slot}</span><div class="bar"><i style="width:${Math.min(p,1)*100}%;background:${col(k.state==="active"?p:0)}"></i></div><span class="num">${k.state==="active"?fmt(left):k.state==="exhausted"?(k.renews?"يتجدد "+fd(k.renews):"خلص"):"تعذر الفحص"}</span></div>`;
  }
  el.innerHTML=h;
}
const fd=t=>t?new Date(t.replace(" ","T")).toLocaleDateString("ar-EG",{day:"numeric",month:"short"}):"—";
function llmState(r){
  const bl=r.blocked_until&&Date.parse(String(r.blocked_until).replace(" ","T"))>Date.now();
  if(Number(r.last_status)===401)return["bad","مفتاح مرفوض (401)"];
  if(r.block_reason==="credits_exhausted")return bl?["bad","الرصيد خلص"]:["warn","الرصيد خلص (آخر مرة "+fd(r.last_used_at)+")"];
  if(bl)return["warn","محظور مؤقتاً"];
  return["ok","شغال"];
}
function renderLLM(el,title,list,note){
  const today=new Date().toISOString().slice(0,10);
  const used=r=>r.usage_day===today?Number(r.used_today):0;
  const ok=list.filter(r=>llmState(r)[0]==="ok").length;
  let h=`<h2>${title}</h2><div class="stats"><div class="stat"><b>${ok} / ${list.length}</b><span>مفاتيح سليمة</span></div><div class="stat"><b>${fmt(list.reduce((s,r)=>s+used(r),0))}</b><span>طلبات النهاردة</span></div></div>`;
  for(const r of list){const[c,t]=llmState(r);h+=`<div class="row l"><span>${r.slot}</span><span style="color:var(--${c==="ok"?"ok":c==="warn"?"warn":"bad"})">${t}</span><span class="num">${used(r)}</span></div>`}
  el.innerHTML=h+`<div class="sub" style="margin-top:8px">${note}</div>`;
}
function draw(d,live){
  render($("tav"),"Tavily",d.tavily.map(k=>({slot:k.slot,state:k.state,cap:k.limit||1000,left:(k.limit||1000)-k.used,renews:k.renews})));
  render($("fc"),"Firecrawl",d.firecrawl.map(k=>({slot:k.slot,state:k.state,cap:k.plan||1000,left:k.remaining,renews:k.renews})));
  const g=(d.llm||[]).filter(r=>r.provider==="gemini"),x=(d.llm||[]).filter(r=>r.provider==="grok");
  renderLLM($("gem"),"Gemini",g,"جوجل مبتعرضش الرصيد المتبقي. العمود الأخير = طلبات النهاردة. إجمالي الطلبات: "+fmt(g.reduce((s,r)=>s+Number(r.total_used),0)));
  renderLLM($("grk"),"Grok",x,"الحالة من آخر محاولة استخدام. رصيد xAI مش متاح من المفتاح. X_6 وX_8 مش مسجلين.");
  const t=d.checked_at?new Date(d.checked_at):null;
  $("when").textContent=(live?"آخر فحص: ":"لقطة قديمة من: ")+(t?t.toLocaleString("ar-EG"):"—");
}
const API="https://clhtimetvykbjdhfdmig.supabase.co/functions/v1/key-status";
let busy=false;
async function load(force){
  if(busy)return;busy=true;const b=$("btn");b.disabled=true;
  if(force)b.textContent="جاري الفحص…";
  $("err").textContent="";
  try{
    const r=await fetch(API+(force?"?refresh=1":""),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    draw(await r.json(),true);
  }catch(e){$("err").textContent="تعذر التحميل ("+e.message+")، المعروض آخر ما وصل."}
  busy=false;b.disabled=false;b.textContent="افحص الآن";
}
$("btn").onclick=()=>load(true);
load(false);setInterval(()=>load(false),60000);

/* ===== صفحات العمليات والأخطاء ===== */
const OPS_API="https://clhtimetvykbjdhfdmig.supabase.co/functions/v1/ops-feed";
const ERR_API="https://clhtimetvykbjdhfdmig.supabase.co/functions/v1/errors-feed";
const KIND={full:"بحث كامل",alternatives:"بدائل",secondary:"بحث ثانوي"};
const OUTC={found:["ok","لقى نتيجة"],not_found:["bad","مفيش نتيجة"],under_review:["warn","قيد المراجعة"]};
const PROV={tavily:"Tavily",firecrawl:"Firecrawl",gemini:"Gemini",grok:"Grok"};
const STYPE={auto:"تلقائي",brand:"براند",ingredient:"مادة فعّالة",brand_family:"عائلة براند"};
const ORIGIN={text:"كتابة",barcode:"باركود",image:"صورة",system:"نظام"};
const CALLK={search:"بحث",scrape_json:"قراءة صفحة (JSON)",scrape_markdown:"قراءة صفحة (نص)",llm:"ذكاء اصطناعي"};
const JOBX={firecrawl_unavailable:"كل مفاتيح Firecrawl مش متاحة (حد طلبات أو رصيد): اتجابت العناوين بس ومفيش صفحات اتقرأت",extraction_failed:"كل الصفحات اللي اتحاولت فشلت",provider_exhausted:"مفاتيح Tavily مش متاحة (رصيد أو حد طلبات)",all_pages_failed:"كل الصفحات فشلت",discovery_failed:"فشل في مرحلة البحث عن الروابط",no_enabled_sources:"مفيش مصادر مفعّلة للبحث",no_pages_on_enabled_sources:"مفيش صفحات على المصادر المفعّلة",alt_source_page_failed:"فشل تحميل صفحة المنتج الأصلي لجلب البدائل"};
const DATAX={new_ingredient_unreviewed:"مادة فعّالة جديدة لسه مش متراجعة",zero_strength:"تركيز صفر",official_non_accepted_source:"مصدر رسمي غير مقبول",official_duplicate_payload:"بيانات رسمية مكررة",official_ingredient_mismatch:"اختلاف مادة فعّالة مع المصدر الرسمي",official_pending_payloads:"بيانات رسمية لسه معلّقة",official_pack_variant:"اختلاف حجم عبوة",official_import_incomplete:"استيراد رسمي ناقص",product_without_ingredients:"منتج بدون مواد فعّالة"};
const IMGX={mismatch:"الصورة ما طابقتش المنتج",brand_differs:"اسم البراند في الصورة مختلف",import_failed:"فشل استيراد الصورة",import_rejected:"الصورة اترفضت"};
const CATS=[["all","الكل"],["api","مزوّدين"],["job","مهام بحث"],["empty","بدون نتيجة"],["image","صور"],["barcode","باركود"],["data","بيانات"]];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n0=x=>fmt(Number(x)||0);
function ago(t){const s=Math.max(0,(Date.now()-Date.parse(t))/1000);if(s<60)return "من "+Math.round(s)+" ث";if(s<3600)return "من "+Math.round(s/60)+" د";if(s<86400)return "من "+Math.round(s/3600)+" س";return new Date(t).toLocaleDateString("ar-EG",{day:"numeric",month:"short"})}
function clock(t){return new Date(t).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function stat(b,l){return '<div class="stat"><b>'+b+'</b><span>'+l+'</span></div>'}
function urow(l,v,p){return '<div class="row"><span>'+l+'</span><div class="bar"><i style="width:'+(Math.min(Math.max(p,0),1)*100)+'%;background:'+col(1-p)+'"></i></div><span class="num">'+v+'</span></div>'}
function trow(l,v){return '<div class="row"><span>'+l+'</span><span>'+v+'</span><span></span></div>'}
function apiExpl(s){
  if(s===429)return "حد الطلبات (Rate limit): المفتاح بيرتاح شوية والنظام بيجرّب مفتاح تاني";
  if(s===402||s===432||s===433)return "رصيد المفتاح خلص";
  if(s===401)return "المفتاح غير صالح";
  if(s===403)return "الوصول مرفوض (حظر أو صلاحية أو رصيد)";
  if(s===408)return "انتهت مهلة الطلب";
  if(s===0)return "فشل الاتصال بالمزوّد";
  if(s>=500)return "المزوّد مشغول أو فيه عطل عنده";
  return "خطأ HTTP "+s;
}
/* كل مفتاح استخدمته العملية وكام صرف منه */
function usageHtml(rows){
  const g={};
  rows.forEach(r=>{
    const k=r.provider+"|"+r.slot;
    const a=g[k]||(g[k]={s:r.slot,parts:[],cr:0,f:0});
    if(r.ok){
      if(r.provider==="tavily")a.parts.push(r.ok+" بحث");
      else if(r.kind==="scrape_json")a.parts.push(r.ok+" صفحة (استخراج JSON)");
      else a.parts.push(r.ok+" صفحة (نص)");
    }
    a.cr+=r.credits;a.f+=r.failed;
  });
  return Object.keys(g).map(k=>{
    const a=g[k];
    return '<div class="use"><b>'+esc(a.s)+'</b> — '+(a.parts.length?a.parts.join(" + "):"بدون نجاح")+' · <span class="cr">'+n0(a.cr)+' كريديت</span>'+(a.f?' · <span class="bad">'+a.f+' فشل</span>':'')+'</div>';
  }).join("");
}
function drawOps(d){
  const s=d.summary,oc=s.outcomes_24h||{},sp=s.spent_24h||{};
  let h='<h2>آخر 24 ساعة</h2><div class="stats">'+stat(n0(s.searches_24h),"عمليات بحث")+stat(n0(s.jobs_24h),"مهام تشغيل")+stat(n0(s.jobs_failed_24h),"مهام فاشلة")+'</div>';
  h+='<div class="sub">لقى: '+n0(oc.found)+' · مفيش نتيجة: '+n0(oc.not_found)+' · قيد المراجعة: '+n0(oc.under_review)+'</div>';
  h+='<h2 style="margin-top:14px">اللي اتصرف فعلاً (آخر 24 ساعة)</h2>';
  h+=trow("Tavily",n0(sp.tavily_calls)+" بحث · "+n0(sp.tavily_credits)+" كريديت");
  h+=trow("Firecrawl",n0(sp.firecrawl_calls)+" طلب ("+n0(sp.firecrawl_failed)+" فشل) · "+n0(sp.firecrawl_credits)+" كريديت");
  h+=trow("Gemini",n0(sp.gemini_calls)+" طلب ("+n0(sp.gemini_failed)+" فشل) · "+n0(sp.gemini_tokens)+" توكن");
  h+=trow("Grok",n0(sp.grok_calls)+" طلب ("+n0(sp.grok_failed)+" فشل) · "+n0(sp.grok_tokens)+" توكن");
  h+='<h2 style="margin-top:14px">كل مفتاح لوحده (24 ساعة)</h2>';
  ["tavily","firecrawl","gemini","grok"].forEach(p=>{
    const ks=(d.keys||[]).filter(k=>k.provider===p);
    if(!ks.length)return;
    h+='<div class="mu" style="margin-top:8px"><b>'+PROV[p]+'</b></div>';
    ks.forEach(k=>{
      const cost=(p==="gemini"||p==="grok")?n0(k.tokens_total)+" توكن":n0(k.credits)+" كريديت";
      h+='<div class="krow"><span>'+esc(k.slot)+'</span><span>'+n0(k.calls)+' طلب</span><span class="'+(k.failed?'bad':'mu')+'">'+n0(k.failed)+' فشل</span><span>'+cost+'</span></div>';
    });
  });
  h+='<h2 style="margin-top:14px">الباقة الكلية (كل المفاتيح)</h2>';
  h+=urow("Tavily",n0(s.tavily_used)+" / "+n0(s.tavily_limit),s.tavily_limit?s.tavily_used/s.tavily_limit:0);
  h+=urow("Firecrawl",n0(s.firecrawl_used)+" / "+n0(s.firecrawl_limit),s.firecrawl_limit?s.firecrawl_used/s.firecrawl_limit:0);
  h+='<div class="sub" style="margin-top:8px">الأرقام فوق من سجل كل طلب فعلي. Tavily وFirecrawl بالكريديت (تقديري لو الـ API ما ذكرش الرقم: بحث = 1، صفحة نص = 1، صفحة JSON = 5)، وGemini وGrok بالتوكن اللي الـ API بيرجّعه. السجل بدأ من وقت تفعيله، فالعمليات القديمة ما لهاش تفصيل.</div>';
  $("osum").innerHTML=h;
  drawFeed(d.items||[]);
  $("owhen").textContent="آخر تحديث: "+clock(d.generated_at);
}
function drawFeed(items){
  let h='<h2>كل العمليات (الأحدث أولاً)</h2>';
  if(!items.length)h+='<div class="mu">مفيش عمليات.</div>';
  for(const o of items){
    let tag,st,meta=[],title,extra="";
    if(o.type==="job"){
      tag=KIND[o.kind]||o.kind||"مهمة";title=esc(o.query);
      st=o.status==="failed"?["bad","فشلت"]:(o.status==="completed"?(OUTC[o.outcome]||["ok","تمت"]):["warn",esc(o.status||"—")]);
      if(o.secs!=null)meta.push("⏱ "+o.secs+" ث");
      if(o.pages)meta.push("صفحات: "+o.pages);
      if(o.results!=null)meta.push("نتائج: "+o.results);
      if(o.usage&&o.usage.length)extra=usageHtml(o.usage);
      else if((o.tavily&&o.tavily.length)||(o.firecrawl&&o.firecrawl.length))extra='<div class="use">الاستهلاك مش متسجل للعملية دي (قبل تفعيل السجل)</div>';
    }else if(o.type==="llm"){
      tag=PROV[o.provider]||o.provider;title="استدعاء ذكاء اصطناعي"+(o.purpose?" — "+esc(o.purpose):"");
      st=o.status===200?["ok","نجح"]:["bad","فشل "+o.status];
      meta.push(esc(o.slot));if(o.model)meta.push(esc(o.model));
      if(o.ttot)meta.push("دخل "+n0(o.tin)+" · خرج "+n0(o.tout)+" · إجمالي "+n0(o.ttot)+" توكن");
      if(o.err)extra='<div class="use bad" dir="auto">'+esc(o.err)+'</div>';
    }else{
      tag="بحث"+(o.cache?" · "+esc(o.cache):"");title=esc(o.query);
      st=OUTC[o.outcome]||["warn",esc(o.outcome||"—")];
      if(o.results!=null)meta.push("نتائج: "+o.results);
    }
    h+='<div class="op"><div><span class="tag">'+esc(tag)+'</span><b dir="auto">'+title+'</b></div>'
      +'<div class="meta"><span class="'+st[0]+'">'+st[1]+'</span><span>'+clock(o.t)+' ('+ago(o.t)+')</span>'+meta.map(x=>'<span>'+x+'</span>').join("")+'</div>'
      +extra+(o.error?'<div class="err">'+esc(o.error)+'</div>':'')+'</div>';
  }
  $("ofeed").innerHTML=h;
}
let obusy=false;
async function loadOps(){
  if(obusy)return;obusy=true;const b=$("obtn");b.disabled=true;$("oerr").textContent="";
  try{
    const r=await fetch(OPS_API,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();drawOps(d);
    if(d.warnings&&d.warnings.length)$("oerr").textContent="تنبيه: "+d.warnings.join(" | ");
  }catch(e){$("oerr").textContent="تعذر التحميل ("+e.message+")"}
  obusy=false;b.disabled=false;
}
/* ===== صفحة الأخطاء ===== */
let EDATA=null,EF="all",EHIDE=false;
function errItem(o){
  const dot='<span class="sev '+o.sev+'"></span>';
  const org='<span class="tag">'+esc(ORIGIN[o.origin]||o.origin)+'</span>';
  const when='<span>'+clock(o.t)+' ('+ago(o.t)+')</span>';
  let title="",body="";
  if(o.cat==="api"){
    title=esc(PROV[o.provider]||o.provider)+' · '+esc(o.slot)+' — '+esc(CALLK[o.kind]||o.kind||"")+' — خطأ '+o.status;
    body='<div class="expl">'+apiExpl(o.status)+'</div>'+(o.detail?'<div class="mu" dir="auto">'+esc(o.detail)+'</div>':'');
  }else if(o.cat==="job"){
    title='مهمة بحث ('+esc(KIND[o.kind]||o.kind||"")+') — '+(JOBX[o.code]?'مشكلة':'فشلت');
    body='<div dir="auto"><b>'+esc(o.query)+'</b></div><div class="expl">'+esc(JOBX[o.code]||o.code||"")+'</div>'+(o.fails&&o.fails.length?'<div class="mu" dir="auto">'+o.fails.map(esc).join(" · ")+'</div>':'');
  }else if(o.cat==="empty"){
    title='بحث بدون نتيجة';
    body='<div dir="auto"><b>'+esc(o.query)+'</b></div><div class="mu">نوع البحث: '+esc(STYPE[o.stype]||o.stype||"—")+'</div>';
  }else if(o.cat==="image"){
    title='مشكلة في صورة منتج: '+esc(IMGX[o.code]||o.code);
    body='<div class="mu" dir="auto">'+(o.brand?'البراند اللي اتقرأ من الصورة: '+esc(o.brand):'')+(o.arabic?' · '+esc(o.arabic):'')+(o.compared&&o.compared.length?' · اتقارن بـ: '+o.compared.map(esc).join("، "):'')+(o.domain?' · '+esc(o.domain):'')+'</div>'
      +(o.reason?'<div class="expl">'+esc(IMGX[o.reason]||o.reason)+'</div>':'');
  }else if(o.cat==="barcode"){
    title='باركود غير موجود';
    body='<div class="mu" dir="ltr">'+esc(o.gtin)+'</div>';
  }else{
    title='مشكلة بيانات: '+esc(DATAX[o.code]||o.code);
    body=o.detail?'<div class="mu" dir="auto">'+esc(o.detail)+'</div>':'';
  }
  return '<div class="op"><div>'+dot+org+'<b>'+title+'</b></div>'+body+'<div class="meta">'+when+'</div></div>';
}
function drawErr(d){
  EDATA=d;
  const s=d.summary;
  let h='<h2>آخر 24 ساعة</h2><div class="stats">'+stat(n0(s.api_total_24h),"أخطاء مزوّدين")+stat(n0(s.jobs_failed_24h),"مهام فاشلة")+stat(n0(s.not_found_24h),"بحث بلا نتيجة")+'</div>';
  h+='<div class="sub">من '+n0(s.searches_24h)+' عملية بحث · مشاكل صور: '+n0(s.image_problems_24h)+' · باركود غير موجود: '+n0(s.barcode_miss_24h)+' · مشاكل بيانات مفتوحة: '+n0(s.integrity_open)+'</div>';
  const a=s.api_24h||{},keys=Object.keys(a).sort((x,y)=>a[y]-a[x]);
  if(keys.length){
    h+='<h2 style="margin-top:14px">أكتر الأخطاء تكراراً</h2>';
    keys.forEach(k=>{const p=k.split(":");h+='<div class="op"><b>'+esc(PROV[p[0]]||p[0])+' — خطأ '+esc(p[1])+'</b> <span class="mu">× '+n0(a[k])+'</span><div class="expl">'+apiExpl(Number(p[1]))+'</div></div>';});
  }
  const jo=s.job_outcomes_24h||{};
  Object.keys(jo).forEach(k=>{h+='<div class="op"><b>'+esc(k)+'</b> <span class="mu">× '+n0(jo[k])+'</span><div class="expl">'+esc(JOBX[k]||"")+'</div></div>';});
  $("esum").innerHTML=h;
  drawErrList();
  $("ewhen").textContent="آخر تحديث: "+clock(d.generated_at);
}
function drawErrList(){
  if(!EDATA)return;
  const all=EDATA.items||[],cnt={};
  all.forEach(o=>{cnt[o.cat]=(cnt[o.cat]||0)+1});
  const items=all.filter(o=>(EF==="all"||o.cat===EF)&&!(EHIDE&&o.sev==="info"));
  let h='<div class="chips">'+CATS.map(c=>'<span class="chip'+(EF===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+(c[0]!=="all"&&cnt[c[0]]?' ('+cnt[c[0]]+')':'')+'</span>').join("")+'<span class="chip'+(EHIDE?' on':'')+'" data-h="1">إخفاء الإرشادي</span></div>';
  h+=items.length?items.slice(0,150).map(errItem).join(""):'<div class="mu">مفيش حاجة في الفلتر ده.</div>';
  $("elist").innerHTML=h;
}
$("elist").addEventListener("click",e=>{
  const t=e.target.closest(".chip");if(!t)return;
  if(t.dataset.f)EF=t.dataset.f;else if(t.dataset.h)EHIDE=!EHIDE;
  drawErrList();
});
let ebusy=false;
async function loadErr(){
  if(ebusy)return;ebusy=true;const b=$("ebtn");b.disabled=true;$("eerr").textContent="";
  try{
    const r=await fetch(ERR_API,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();drawErr(d);
    if(d.warnings&&d.warnings.length)$("eerr").textContent="تنبيه: "+d.warnings.join(" | ");
  }catch(e){$("eerr").textContent="تعذر التحميل ("+e.message+")"}
  ebusy=false;b.disabled=false;
}
function tab(){
  const h=location.hash,pg=h==="#ops"?"ops":(h==="#errors"?"err":"keys");
  $("pg-keys").hidden=pg!=="keys";$("pg-ops").hidden=pg!=="ops";$("pg-err").hidden=pg!=="err";
  $("t-keys").className=pg==="keys"?"on":"";$("t-ops").className=pg==="ops"?"on":"";$("t-err").className=pg==="err"?"on":"";
  if(pg==="ops")loadOps();else if(pg==="err")loadErr();
}
$("obtn").onclick=loadOps;$("ebtn").onclick=loadErr;
window.addEventListener("hashchange",tab);
setInterval(()=>{if(document.hidden)return;if(location.hash==="#ops")loadOps();else if(location.hash==="#errors")loadErr()},15000);
tab();
</script>
</body>
